# Civitas Orbita - orchestration Docker
#
#   Production :  docker compose up --build        -> http://localhost:8080
#   Dev (HMR) :   docker compose --profile dev up dev -> http://localhost:5173
#   API seule :   npm run dev:server               -> http://localhost:3001

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: civitas-orbita-api:latest
    container_name: civitas-orbita-api
    environment:
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DATABASE_PATH: /data/civitas.db
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    volumes:
      - civitas-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      target: prod
    image: civitas-orbita:latest
    container_name: civitas-orbita-web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  dev:
    build:
      context: .
      target: dev
    image: civitas-orbita:dev
    container_name: civitas-orbita-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    profiles:
      - dev

volumes:
  civitas-data:
